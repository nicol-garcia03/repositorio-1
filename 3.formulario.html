<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;500;700&display=swap" rel="stylesheet">
    <title>Login - Yard Sale</title>
    <style>
        :root {
            --white: #FFFFFF;
            --black: #000000;
            --very-light-pink: #C7C7C7;
            --text-input-field: #F7F7F7;
            --hospital-green: #ACD9B2;
            --sm: 14px;
            --md: 16px;
            --lg: 18px;
        }

        body {
            margin: 0;
            font-family: 'Quicksand', sans-serif;
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #F7F7F7;
        }

        .nav-left, .nav-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-logo {
            width: 120px;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 12px;
            margin: 0;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--very-light-pink);
            font-size: var(--sm);
        }

        .nav-links a.active {
            border: 1px solid var(--hospital-green);
            color: var(--hospital-green);
            padding: 4px 12px;
            border-radius: 12px;
        }
        .login {
            width: 100%;
            height: calc(100vh - 60px);
            display: grid;
            place-items: center;
        }

        .form-container {
            display: grid;
            grid-template-rows: auto 1fr auto;
            width: 300px;
        }

        .logo {
            width: 150px;
            margin-bottom: 48px;
            justify-self: center;
            display: none;
        }

        .form {
            display: flex;
            flex-direction: column;
        }

        .label {
            font-size: var(--sm);
            font-weight: bold;
            margin-bottom: 4px;
        }

        .input {
            background-color: var(--text-input-field);
            border: none;
            border-radius: 8px;
            height: 40px;
            font-size: var(--md);
            margin-bottom: 12px;
        }

        .input-email {
            margin-bottom: 22px;
        }

        .primary-button {
            background-color: var(--hospital-green);
            border-radius: 8px;
            border: none;
            color: var(--white);
            width: 100%;
            font-size: var(--md);
            font-weight: bold;
            height: 50px;
        }

        .secondary-button {
            background-color: var(--white);
            border-radius: 8px;
            border: 1px solid var(--hospital-green);
            color: var(--hospital-green);
            width: 100%;
            font-size: var(--md);
            font-weight: bold;
            height: 50px;
        }

        .login-button {
            margin-top: 14px;
            margin-bottom: 30px;
        }

        .forgot-password {
            color: var(--hospital-green);
            font-size: var(--sm);
            text-align: center;
            text-decoration: none;
            margin-bottom: 52px;
        }
        @media (max-width: 640px) {
            .navbar {
                display: none; 
            }

            .login {
                height: 100vh;
            }

            .logo {
                display: block; 
            }

            .secondary-button {
                position: absolute;
                bottom: 24px;
                width: 300px;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-left">
            <img src="./logo_yard_sale.svg" alt="logo" class="nav-logo">
            <ul class="nav-links">
                <li><a href="/" class="active">All</a></li>
                <li><a href="/">Clothes</a></li>
                <li><a href="/">Electronics</a></li>
                <li><a href="/">Furniture</a></li>
                <li><a href="/">Toys</a></li>
                <li><a href="/">Others</a></li>
            </ul>
        </div>
        <div class="nav-right">
            <a href="/" style="color: var(--hospital-green); font-size: var(--sm); text-decoration: none;">Sign in</a>
        </div>
    </nav>
    <div class="login">
        <div class="form-container">
            <img src="../clase 2/imagen-logo.jpg" alt="">

            <form action="/" class="form">
                <label for="email" class="label">Email address</label>
                <input type="text" id="email" placeholder="*****" class="input input-email">

                <label for="password" class="label">Password</label>
                <input type="password" id="password" placeholder="***" class="input input-password">

                <input type="submit" value="Log in" class="primary-button login-button">
                <a href="/" class="forgot-password">Forgot my password</a>
            </form>

            <button class="secondary-button signup-button">Sign up</button>
        </div>
    </div>
</body>
</html>

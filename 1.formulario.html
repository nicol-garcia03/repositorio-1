<!DOCTYPE html>
<html lang="en">
head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
    <title>Document</title>
    <style>
         :root{
            --very-light-pink: #630202;
            --text-input-field: #db7070dc;
            --hospital-green: #ACD9B2;
            --white: #ffffff;
            --black: #000000;
            --sn:14px;x
            --md:16px;
            --lg:18px;
        }
        body{
            font-family: "Quicksand", sans-serif;
            margin: 0;
        }
        .login{
            width: 100%;
            height: 100vh;
            display: grid;
            place-items: center;
        }
        .form-contalnar{
            display: grid;
            grid-template-rows: auto 1fr auto;
            width: 350px;
        }
        .logo{
            width: 150px;
            margin-bottom:40px ;
            justify-self: center;
            display:none;
        }
         
        .title{
             font-size:var(--lg) ;
             margin: 12px;
             text-align: center;
        }
        .subtitle{
            color: var(--very-light-pink);
            font-size:var(--md);
            font-weight: 300;
            margin-top: 0;
            margin-bottom: 32px;
            text-align: center;

        }
        .label{
         font-size: var(--sm);   
         font-weight: bold;
         margin-bottom: 4px;
        }
        .input{background-color: var(--text-input-field);
            border: none;
            border-radius: 8px;
            height: 30px;
            font-size: var(--md);
            padding-bottom: 12 px;

        }
        .form{
            display: flex;
            flex-direction: column;
        }
        .primary-button{
            background-color: var(--hospital-green);
            border: none;
            border-radius: 8px;
            color: var(--white);
            width: 100%;
            font-size: var(--md);
            font-weight: bold;
            height: 50px;
        }
        @media{max-width: 640px}
            .logo{
                display: block;
            }

    
    </style>
</head>
<body>
  <div class="login">
    <div class="form-container">
        <img src="/clase 2/imagen-logo.jpg" alt="imagen-logo.jpg" class="logo">
        <h1 class="titulo">Creater a new password</h1>
        <p class="subtitulo"> Enter a new password for you account</p>
        <form action="/" class="form">
            <label for="password" class="label">password</label>
            <input type="password" class="input input-passw" id="password" placeholder="******">

             <label for="new-password" class="label">Re-enter Password</label>
            <input type="password" class="input input-passw" id="new-password" placeholder="******">
            <input type="submit" value="confirm" class="primary-button login-button">
        </form>
    </div>

  </div>  
</body>
</html>
